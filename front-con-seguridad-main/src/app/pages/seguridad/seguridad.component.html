<div class="seguridad-layout">
  <nav class="responsive-top-menu">
    <a [class.active]="activeTab === 'users'" (click)="navigate('users')">Users</a>
    <a [class.active]="activeTab === 'roles'" (click)="navigate('roles')">Roles</a>
    <a [class.active]="activeTab === 'permissions'" (click)="navigate('permissions')">Permissions</a>
  </nav>
  <aside class="seguridad-sidebar">
    <ul>
      <li [class.active]="activeTab === 'users'" (click)="navigate('users')">Users</li>
      <li [class.active]="activeTab === 'roles'" (click)="navigate('roles')">Roles</li>
      <li [class.active]="activeTab === 'permissions'" (click)="navigate('permissions')">Permissions</li>
    </ul>
  </aside>
  <main class="seguridad-main">
    <div class="entity-counter-bar">
      <span><b>Users:</b> {{ usersCount }}</span>
      <span><b>Roles:</b> {{ rolesCount }}</span>
      <span><b>Permissions:</b> {{ permissionsCount }}</span>
    </div>
    <router-outlet></router-outlet>
  </main>
</div>

  display: flex;

  font-size: 1.1em;
  color: #233876;
